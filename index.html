<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krav Maga 67 — Planning</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:auto;padding:18px;background:#f4f4f4;color:#111}
h1{margin-bottom:4px}.sub{color:#666}.card{background:white;padding:16px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #0001}
.item{padding:14px 0;border-top:1px solid #ddd}.item:first-child{border-top:0}
button,input{font-size:16px;padding:11px;border-radius:9px}button{border:0;background:#111;color:#fff;font-weight:700}input{border:1px solid #bbb;width:100%;box-sizing:border-box;margin:5px 0 10px}
button.red{background:#b00020}.ok{color:#08752b;font-weight:700}.muted{color:#666}
</style></head><body>
<h1>Krav Maga 67</h1><div class="sub">Strasbourg · Tous les mardis et jeudis à 19h · Planning jusqu’au 30 juin 2027</div>
<div class="card"><p id="status">Chargement…</p><div id="list"></div></div>
<div class="card"><h2>Administration</h2>
<input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Mot de passe">
<button id="login">CONNEXION ADMIN</button> <button id="seed" style="display:none">CRÉER / RÉPARER LE PLANNING</button>
<p id="adminmsg" class="muted"></p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL="https://mhlucqlvkrmxeqtxscsa.supabase.co", KEY="sb_publishable_5MDhWWtcV1UTKmANWOF_IA_ZSjPGGBA";
const db=supabase.createClient(URL,KEY); let sessions=[];
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const iso=d=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
const fmt=s=>new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(s+"T12:00:00"));
function makeDates(){
 let a=[],d=new Date();d.setHours(0,0,0,0);let end=new Date("2027-06-30T00:00:00");
 for(;d<=end;d.setDate(d.getDate()+1)) if(d.getDay()===2||d.getDay()===4)a.push({date:iso(d),time:"19:00:00",type:"Entraînement",place:"Strasbourg"});
 return a;
}
function renderLocal(){
 const base=makeDates();
 sessions=base.map(x=>({...x}));
 render();
 document.getElementById("status").textContent="Planning affiché · mardis et jeudis à 19h · jusqu’au 30 juin 2027";
}
async function load(){
 renderLocal();
 try{
   const result=await Promise.race([
     db.from("entrainements").select("id,date,time,type,place,responsable"),
     new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),5000))
   ]);
   const {data,error}=result;
   if(error) throw error;
   const map=new Map();
   (data||[]).forEach(r=>{
     const k=r.date+"|"+String(r.time).slice(0,5);
     if(!map.has(k)||r.responsable) map.set(k,r);
   });
   sessions=makeDates().map(x=>({...x,...(map.get(x.date+"|19:00")||{})}));
   document.getElementById("status").textContent="Planning partagé actif · jusqu’au 30 juin 2027";
   render();
 }catch(e){
   document.getElementById("status").textContent="Planning affiché · connexion partagée indisponible pour le moment.";
 }
}
function render(){
 document.getElementById("list").innerHTML=sessions.map((s,i)=>`<div class="item">
 <b>${esc(fmt(s.date))}</b><br><span class="muted">19:00 · Strasbourg</span><br>
 ${s.responsable?`Responsable : <b>${esc(s.responsable)}</b><br><button class="red" onclick="release(${i})">JE NE PEUX PLUS</button>`
 :`<button onclick="take(${i})">JE PRENDS CET ENTRAÎNEMENT</button>`}
 </div>`).join("");
}
async function take(i){
 let s=sessions[i], name=prompt("Ton prénom :"); if(!name?.trim())return;
 if(!s.id){let r=await db.from("entrainements").insert({date:s.date,time:"19:00",type:"Entraînement",place:"Strasbourg",responsable:name.trim()}).select().single();if(r.error){alert(r.error.message);return}}
 else {let r=await db.from("entrainements").update({responsable:name.trim()}).eq("id",s.id).is("responsable",null);if(r.error){alert("Cette séance vient peut-être d'être prise.");return}}
 await load();
}
async function release(i){
 let s=sessions[i]; if(!s.responsable)return;
 let name=prompt("Pour libérer cette séance, indique le prénom du responsable :"); if(name?.trim()!==s.responsable){if(name!==null)alert("Le prénom ne correspond pas.");return}
 let r=await db.from("entrainements").update({responsable:null}).eq("id",s.id).eq("responsable",s.responsable);
 if(r.error){alert("La libération est bloquée par la sécurité Supabase. Exécute le fichier supabase.sql corrigé.");return}
 await load();
}
document.getElementById("login").onclick=async()=>{let r=await db.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){alert(r.error.message);return}document.getElementById("seed").style.display="inline-block";adminmsg.textContent="Administrateur connecté.";};
document.getElementById("seed").onclick=async()=>{
 let rows=makeDates();let old=await db.from("entrainements").select("date,time");let have=new Set((old.data||[]).map(x=>x.date+"|"+String(x.time).slice(0,5)));
 let missing=rows.filter(x=>!have.has(x.date+"|19:00"));
 if(missing.length){let r=await db.from("entrainements").insert(missing);if(r.error){alert(r.error.message);return}}
 alert(missing.length+" séances ajoutées. Le planning va jusqu'à dans un an.");await load();
};
load();
</script></body></html>
