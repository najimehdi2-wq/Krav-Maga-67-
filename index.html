<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krav Maga 67 — Planning</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#111}
header{background:#111;color:#fff;padding:22px 16px;text-align:center}h1{margin:0 0 6px;font-size:26px}
main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
.session{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #ddd;padding:14px 0}
.session:first-child{border-top:0}.date{font-weight:700;font-size:18px}.meta{color:#555;margin-top:4px}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer;background:#111;color:#fff}
button.secondary{background:#ddd;color:#111}button.danger{background:#b00020}
input{width:100%;padding:12px;border:1px solid #bbb;border-radius:9px;margin:6px 0 10px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.ok{color:#08752b;font-weight:700}.err{color:#b00020;font-weight:700}
.small{font-size:13px;color:#666}.responsable{font-weight:700}
@media(max-width:560px){.session{align-items:flex-start;flex-direction:column}.session button{width:100%}}
</style>
</head>
<body>
<header><h1>KRAV MAGA 67</h1><div>Planning des entraînements</div></header>
<main>
<div class="card">
  <div class="row">
    <button id="refreshBtn">Actualiser</button>
    <button id="adminBtn" class="secondary">Administration</button>
  </div>
  <p id="status" class="small">Chargement…</p>
</div>

<div class="card">
  <h2>Prochains entraînements</h2>
  <div id="sessions"></div>
</div>

<div id="adminPanel" class="card hidden">
  <h2>Administration</h2>
  <div id="loginBox">
    <input id="email" type="email" placeholder="Email administrateur">
    <input id="password" type="password" placeholder="Mot de passe">
    <button id="loginBtn">Se connecter</button>
  </div>
  <div id="adminBox" class="hidden">
    <p id="adminStatus" class="small"></p>
    <button id="seedBtn">Créer automatiquement les mardis et jeudis</button>
    <button id="logoutBtn" class="secondary">Se déconnecter</button>
  </div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mhlucqlvkrmxeqtxscsa.supabase.co";
const SUPABASE_KEY = "sb_publishable_5MDhWWtcV1UTKmANWOF_IA_ZSjPGGBA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const status = $("status");
const sessionsEl = $("sessions");

function localISO(d){
  const x = new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,10);
}
function labelDate(s){
  return new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(s+"T12:00:00"));
}
function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function fallbackSessions(){
  const out=[];
  const now=new Date(); now.setHours(0,0,0,0);
  const end=new Date(now); end.setFullYear(end.getFullYear()+1);
  for(let d=new Date(now); d<=end; d.setDate(d.getDate()+1)){
    const day=d.getDay();
    if(day===2 || day===4) out.push({
      id:"local-"+localISO(d),date:localISO(d),time:"19:00:00",
      type:"Entraînement",place:"Strasbourg",responsable:null,local:true
    });
  }
  return out;
}
let current=[];

async function load(){
  status.textContent="Chargement…";
  const {data,error}=await sb.from("entrainements")
    .select("id,date,time,type,place,responsable")
    .order("date",{ascending:true}).order("time",{ascending:true});
  if(error){
    current=fallbackSessions();
    status.innerHTML='<span class="err">Connexion base indisponible : affichage du planning local.</span>';
  }else{
    current=data||[];
    if(!current.length){ current=fallbackSessions(); status.textContent="Planning automatique affiché. Connectez-vous en administration pour le partager."; }
    else status.textContent="Planning partagé actif.";
  }
  render();
}
function render(){
  if(!current.length){sessionsEl.innerHTML="<p>Aucune séance.</p>";return}
  sessionsEl.innerHTML=current.slice(0,60).map(s=>{
    const taken=!!s.responsable;
    return `<div class="session">
      <div>
        <div class="date">${escapeHtml(labelDate(s.date))}</div>
        <div class="meta">${escapeHtml((s.time||"19:00").slice(0,5))} · ${escapeHtml(s.place||"Strasbourg")} · ${escapeHtml(s.type||"Entraînement")}</div>
        <div class="meta">${taken?`Responsable : <span class="responsable">${escapeHtml(s.responsable)}</span>`:"<span>Personne responsable pour le moment</span>"}</div>
      </div>
      <div>${taken
        ? `<button class="danger" onclick="release('${s.id}')">Je ne peux plus</button>`
        : `<button onclick="take('${s.id}')">Je prends cet entraînement</button>`}
      </div>
    </div>`;
  }).join("");
}
window.take=async function(id){
  const s=current.find(x=>x.id===id); if(!s)return;
  const name=prompt("Ton prénom :");
  if(!name || !name.trim())return;
  if(s.local){
    s.responsable=name.trim(); render(); return;
  }
  const {error}=await sb.from("entrainements").update({responsable:name.trim()}).eq("id",id).is("responsable",null);
  if(error){alert("Impossible de prendre cette séance.");return}
  await load();
};
window.release=async function(id){
  const s=current.find(x=>x.id===id); if(!s)return;
  if(!confirm("Libérer cette séance ?"))return;
  if(s.local){s.responsable=null;render();return}
  const {error}=await sb.from("entrainements").update({responsable:null}).eq("id",id);
  if(error){alert("Pour libérer une séance partagée, connecte-toi en administration.");return}
  await load();
};

$("refreshBtn").onclick=load;
$("adminBtn").onclick=async()=>{
  $("adminPanel").classList.toggle("hidden");
  const {data:{session}}=await sb.auth.getSession();
  if(session){$("loginBox").classList.add("hidden");$("adminBox").classList.remove("hidden");$("adminStatus").textContent="Connecté."; }
};
$("loginBtn").onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});
  if(error){alert(error.message);return}
  $("loginBox").classList.add("hidden");$("adminBox").classList.remove("hidden");
  $("adminStatus").textContent="Connecté. Tu peux maintenant créer le planning partagé.";
};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload();};

$("seedBtn").onclick=async()=>{
  const start=new Date(); start.setHours(0,0,0,0);
  const end=new Date(start); end.setFullYear(end.getFullYear()+1);
  const rows=[];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    if(d.getDay()===2||d.getDay()===4) rows.push({
      date:localISO(d),time:"19:00",type:"Entraînement",place:"Strasbourg"
    });
  }
  const {error}=await sb.from("entrainements").upsert(rows,{onConflict:"date,time"});
  if(error){
    // date,time n'est pas forcément une contrainte unique : insertion sans upsert
    const {data:existing}=await sb.from("entrainements").select("date,time");
    const seen=new Set((existing||[]).map(x=>x.date+"|"+x.time));
    const missing=rows.filter(x=>!seen.has(x.date+"|"+x.time));
    if(missing.length){
      const r=await sb.from("entrainements").insert(missing);
      if(r.error){alert("Erreur : "+r.error.message);return}
    }
  }
  alert("Planning créé : tous les mardis et jeudis à 19 h.");
  await load();
};

sb.channel("planning-live").on("postgres_changes",
 {event:"*",schema:"public",table:"entrainements"},()=>load()).subscribe();

load();
</script>
</body>
</html>
