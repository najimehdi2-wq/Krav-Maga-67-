<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krav Maga 67 — Planning</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#111}
main{max-width:700px;margin:auto;padding:20px}
h1{margin:0 0 5px}.sub{color:#666;font-size:14px}
.card{background:white;border:1px solid #ddd;border-radius:15px;padding:16px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 16px;background:#111;color:white;font-size:15px}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.free{background:#fff4d6}.taken{background:#e9f7ef}
.hidden{display:none}.error{color:#a00}.ok{color:#176b35}
</style>
</head>

<body>
<main>
<h1>Planning des entraînements</h1>
<div class="sub">Krav Maga 67 · Strasbourg</div>

<p id="message" class="sub"></p>
<div id="sessions"></div>

<div class="card">
<h3>Prendre un entraînement</h3>
<div class="grid">
<div>
<label>Ton prénom</label>
<input id="name" placeholder="Ex. Thomas">
</div>
<div>
<label>Séance</label>
<select id="choice"></select>
</div>
</div>
<br>
<button onclick="take()">JE PRENDS CET ENTRAÎNEMENT</button>
</div>

<div class="card">
<h3>Administration</h3>

<div id="login">
<div class="grid">
<div>
<label>E-mail</label>
<input id="email" type="email">
</div>
<div>
<label>Mot de passe</label>
<input id="password" type="password">
</div>
</div>
<br>
<button onclick="login()">CONNEXION ADMIN</button>
</div>

<div id="admin" class="hidden">
<p class="ok">Administrateur connecté</p>
<div class="grid">
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Heure</label><input id="time" type="time" value="19:00"></div>
<div><label>Type</label><input id="type" value="Entraînement"></div>
<div><label>Lieu</label><input id="place" value="Strasbourg"></div>
</div>
<br>
<button onclick="add()">AJOUTER LA SÉANCE</button>
<button onclick="logout()">DÉCONNEXION</button>
</div>
</div>
</main>

<script>
const URL="https://mhlucqlvkrmxeqtxscsa.supabase.co";
const KEY="sb_publishable_5MDhWWtcV1UTKmANWOF_IA_ZSjPGGBA";
const db=supabase.createClient(URL,KEY);
let data=[];

const $=x=>document.getElementById(x);
const esc=x=>String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateFR=d=>new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"}).format(new Date(d+"T12:00:00"));

function message(t,c="sub"){$("message").textContent=t;$("message").className=c}

async function load(){
 const r=await db.from("entrainements").select("*").order("date").order("time");
 if(r.error){message(r.error.message,"error");return}
 data=r.data||[];
 render();
}

function render(){
 $("sessions").innerHTML="";
 $("choice").innerHTML="";
 data.forEach(s=>{
  let div=document.createElement("div");
  div.className="card "+(s.responsable?"taken":"free");
  div.innerHTML=
   "<div class='row'><div><b>"+esc(dateFR(s.date))+"</b><br>"+
   "<span class='sub'>"+esc(s.time)+" · "+esc(s.type)+" · "+esc(s.place)+"</span></div>"+
   "<div>"+(s.responsable?
   "✅ <b>"+esc(s.responsable)+"</b>":
   "🟠 <b>À prendre</b>")+"</div></div>";
  $("sessions").appendChild(div);

  if(!s.responsable){
   let o=document.createElement("option");
   o.value=s.id;
   o.textContent=dateFR(s.date)+" · "+s.time;
   $("choice").appendChild(o);
  }
 });
}

async function take(){
 let n=$("name").value.trim(),id=$("choice").value;
 if(!n||!id){message("Indique ton prénom et choisis une séance.","error");return}
 let r=await db.from("entrainements")
   .update({responsable:n})
   .eq("id",id)
   .is("responsable",null);
 if(r.error){message(r.error.message,"error");return}
 $("name").value="";
 message("Entraînement pris par "+n+".","ok");
 load();
}

async function login(){
 let r=await db.auth.signInWithPassword({
   email:$("email").value,
   password:$("password").value
 });
 if(r.error){message("Connexion refusée.","error");return}
 $("login").classList.add("hidden");
 $("admin").classList.remove("hidden");
 message("Administrateur connecté.","ok");
}

async function add(){
 let r=await db.from("entrainements").insert({
   date:$("date").value,
   time:$("time").value,
   type:$("type").value||"Entraînement",
   place:$("place").value||"Strasbourg"
 });
 if(r.error){message(r.error.message,"error");return}
 message("Séance ajoutée.","ok");
 load();
}

async function logout(){
 await db.auth.signOut();
 $("admin").classList.add("hidden");
 $("login").classList.remove("hidden");
}

db.channel("planning")
 .on("postgres_changes",{event:"*",schema:"public",table:"entrainements"},load)
 .subscribe();

load();
</script>
</body>
</html>
